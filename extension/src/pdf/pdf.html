<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PDF · Halo</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/16.png">
<style>
body{margin:0;background:#525659;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eee}
#bar{position:sticky;top:0;z-index:5;background:#323639;padding:8px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#bar b{color:#ff5a36}#bar span{opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
canvas{background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#text{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;white-space:pre-wrap}
</style></head>
<body>
<div id="bar"><b>◯ Halo</b> <span id="name">Loading PDF…</span></div>
<div id="pages"></div>
<div id="text" aria-hidden="true"></div>
<script type="module" src="pdf.js"></script>
<script src="content.js"></script>
</body></html>
