<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Halo setup</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/16.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7fb;color:#1b1b2f;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.card{background:#fff;border:1px solid #e6e6f2;border-radius:18px;padding:32px;max-width:460px;box-shadow:0 20px 50px rgba(20,20,60,.08)}
h1{margin:0 0 6px;font-size:24px}h1 span{color:#ff5a36}
p{color:#5b5b7a}button{font:inherit;font-weight:600;background:#3730d6;color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
.ok{color:#15803d;font-weight:600}.bad{color:#dc2626;font-weight:600}
ol{color:#5b5b7a;padding-left:20px}kbd{font:13px ui-monospace,Menlo,monospace;background:#f1f0ff;padding:2px 6px;border-radius:5px}
</style></head>
<body><div class="card">
<h1><span>◯</span> Halo setup</h1>
<p>Grant microphone access once so you can ask questions out loud from any page.</p>
<button id="grant">Enable microphone</button>
<p id="status"></p>
<ol>
  <li>Click the Halo toolbar icon to open the side panel.</li>
  <li>On any page press <kbd>Alt+C</kbd>, circle something, and ask.</li>
</ol>
</div><script src="setup.js"></script></body></html>
